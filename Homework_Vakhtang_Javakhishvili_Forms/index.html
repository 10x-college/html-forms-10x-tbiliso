<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jovian Drift SOS</title>
    <link rel="stylesheet" href="./styles/styles.css">
</head>

<body>
    <main>
        <!-- Pilot Credentials fieldset-->
        <iframe id="bg-frame" src="./styles/effect.html"></iframe>
        <form action="#" method="post">
            <fieldset>
                <legend>
                    Pilot Credentials
                </legend>
                <label for="pilot-name">
                    Pilot Name:
                </label>
                <input type="text" id="pilot-name" name="pilot_name" required placeholder="Enter name">
                <label for="kebab-case:">Access Code:</label>
                <input type="password" id="kebab-case:" name="snake_case:" required>
                <label for="command_email">Command Email</label>
                <input type="email" id="command_email" name="email" required>
            </fieldset>
            <!-- Vessel Diagnostics fieldset-->
            <fieldset>
                <legend>
                    Vessel Diagnostics
                </legend>
                <label for="hull_damage">Hull Damage (%):</label>
                <input type="number" id="hull_damage" name="hull_damage" required>
                <label for="emergency_level">Emergency Level:</label>
                <!-- ასარჩევი სია -->
                <select name="Emergency Level" id="emergency_level" required>
                    <!-- სიაში არ მინდა რომ მიჩანდეს პირველი ასარჩევი მნიშვნელობა დეფაულტად -->
                    <option value="" disabled selected hidden>choose</option>
                    <option value="low">low</option>
                    <option value="medium">medium</option>
                    <option value="high">high</option>
                </select>
            </fieldset>
            <!-- Mission Log & Evidence fieldset -->
            <fieldset>
                <legend>
                    Mission Log & Evidence
                </legend>
                <label for="sos_message">
                    SOS Message:
                </label>
                <textarea name="sos Message" id="sos_message" required rows="4" cols="30" maxlength="500"
                    placeholder="Enter SOS mesage"></textarea>
                <div>
                    <input type="checkbox" name="quarantine" id="quarantine" required>
                    <label for="quarantine">I agree to quarantine protocols.</label>
                </div>
            </fieldset>
            <button type="submit">
                INITIATE TRANSMISSION
            </button>
            <button type="reset">RESET SYSTEM</button>
        </form>
    </main>
    <script src="./scripts/launch.js"></script>
</body>

</html>
